name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned toolchain
        run: pnpm toolchain:check

      - name: Validate documentation and agent workspace
        run: |
          node scripts/validate-agent-workspace.mjs
          node scripts/sync-master-spec.mjs --check

      - name: Scan repository secret patterns
        run: pnpm secrets:check

      - name: Audit all executable dependencies
        run: pnpm security:audit

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and check architecture boundaries
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run covered tests
        run: pnpm test:coverage

      - name: Validate game content
        run: pnpm game:validate-content -- --seeds=120

      # A deterministic sweep, so CI stays reproducible. The deeper sweep used
      # for balance work is a local command.
      - name: Simulate deterministic runs
        run: pnpm game:simulate -- --runs=400 --verify=10

      - name: Build production application
        run: pnpm build

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production application
        run: pnpm build

      - name: Run Playwright
        run: pnpm test:e2e:only

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  container-smoke:
    name: Production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build standalone image
        run: >-
          docker build
          --target runner
          --tag egresado:ci
          --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          .

      - name: Start standalone container
        run: >-
          docker run --detach
          --name egresado-container-smoke
          --publish 127.0.0.1:3000:3000
          egresado:ci

      - name: Verify standalone runtime
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs egresado-container-smoke
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' egresado-container-smoke)" = "node"
          ! docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' egresado-container-smoke | grep --quiet '^SUPABASE_SECRET_KEY='

      - name: Remove standalone container
        if: ${{ always() }}
        run: docker rm --force egresado-container-smoke 2>/dev/null || true
