schema_version: 1
family_id: mural
template_id: mural.coverage-packages.v1
stages: [grade-7]
placement: checkpoint
status: draft

narrative:
  title: El mural
  context: La clase tiene que comprar pintura para la feria.

math:
  domains: [geometry, proportional_reasoning, optimization]
  objective: Determine the smallest package combination that covers the required area.
  support:
    formula_reference: optional
    calculator: allowed

variant:
  generator: constraint-first
  invariants:
    - at_least_one_valid_solution
    - unique_optimum
    - readable_decimals
    - no_duplicate_options

cognitive:
  steps: 3
  constraints: 1
  selection: 1
  optimization: 1
  uncertainty: 0
  construction: 0
  derived_band: STANDARD # derivada de cognitive; no es un override de autoría

interaction:
  type: choice

outcomes:
  optimal:
    meaning: Meets requirement with minimum justified resource use.
  resolved:
    meaning: Meets requirement but with unnecessary excess.
  insufficient:
    meaning: Does not meet required coverage.

career_effects:
  may_change: [promedio, estilo]

competitive:
  math_quality: evaluator_defined
  team_contribution: none
  aura_contribution: none

hidden:
  mastery: [geometry, optimization]
  flags: []

review:
  math_teacher_status: pending
  notes: ''
